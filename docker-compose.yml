services:
  web-salud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-reserva-salud
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - SERVICE_NAME=${SERVICE_NAME:-reserva-horas-medicas}
    restart: unless-stopped